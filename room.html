
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game Room</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: sans-serif;
        }
    </style>
</head>

<body class="bg-gray-900 text-white min-h-screen p-5">

    <div class="max-w-lg mx-auto">

        <h2 class="text-2xl font-bold text-center mb-3">
            🐺 ห้องเล่นเกมมนุษย์หมาป่า
        </h2>

        <div class="bg-gray-800 p-4 rounded-lg mb-4 text-center">
            <p>รหัสห้อง</p>
            <h1 id="displayRoomCode"
                class="text-3xl font-bold text-yellow-400">---</h1>

            <p class="mt-3">สถานะเกม</p>
            <b id="gameStatus" class="text-green-400">
                กำลังรอผู้เล่น...
            </b>
        </div>

        <!-- ข้อมูลของฉัน -->
        <div class="bg-gray-800 p-4 rounded-lg mb-4">
            <h3 class="text-xl font-bold mb-3">👤 ข้อมูลของคุณ</h3>

            <p>ชื่อ: <b id="myName">-</b></p>
            <p>บทบาท: <b id="myRole" class="text-yellow-400">
                รอเริ่มเกม
            </b></p>
            <p>สถานะ: <b id="myStatus">มีชีวิต 🟢</b></p>
        </div>

        <!-- Host -->
        <div id="hostControls"
             class="hidden bg-gray-800 p-4 rounded-lg mb-4">

            <h3 class="text-xl font-bold mb-3">
                👑 เมนู Host
            </h3>

            <button id="startGameBtn"
                class="w-full bg-red-600 hover:bg-red-700 p-3 rounded-lg font-bold">
                🐺 เริ่มเกม
            </button>

            <p class="text-gray-400 text-sm mt-2 text-center">
                ต้องมีผู้เล่นอย่างน้อย 3 คน
            </p>
        </div>

        <!-- Player List -->
        <div class="bg-gray-800 p-4 rounded-lg mb-4">
            <h3 class="text-xl font-bold mb-3">
                👥 ผู้เล่นในห้อง
            </h3>

            <div id="playerCount" class="text-gray-400 mb-2">
                ผู้เล่น 0 คน
            </div>

            <div id="playerList"></div>
        </div>

        <button id="leaveRoomBtn"
            class="w-full bg-gray-600 hover:bg-gray-700 p-3 rounded-lg">
            ออกจากห้อง
        </button>

    </div>

    <script type="module">

        import {
            db,
            ref,
            get,
            onValue,
            runTransaction
        } from "./firebase-config.js";

        // =========================
        // PLAYER DATA
        // =========================

        let playerData;

        try {
            playerData = JSON.parse(
                localStorage.getItem("werewolf_player")
            );
        } catch (error) {
            playerData = null;
        }

        if (!playerData ||
            !playerData.roomCode ||
            !playerData.playerId) {

            alert("ไม่พบข้อมูลผู้เล่น!");

            window.location.href = "index.html";

            throw new Error("Player data not found");
        }

        const { roomCode, playerId, name } = playerData;

        const roomRef = ref(db, `rooms/${roomCode}`);

        // =========================
        // ELEMENTS
        // =========================

        const displayRoomCode =
            document.getElementById("displayRoomCode");

        const gameStatus =
            document.getElementById("gameStatus");

        const myName =
            document.getElementById("myName");

        const myRole =
            document.getElementById("myRole");

        const myStatus =
            document.getElementById("myStatus");

        const hostControls =
            document.getElementById("hostControls");

        const playerList =
            document.getElementById("playerList");

        const playerCount =
            document.getElementById("playerCount");

        const startGameBtn =
            document.getElementById("startGameBtn");

        displayRoomCode.textContent = roomCode;
        myName.textContent = name;

        // =========================
        // REALTIME DATABASE
        // =========================

        onValue(roomRef, (snapshot) => {

            if (!snapshot.exists()) {

                alert("ห้องนี้ถูกลบแล้ว!");

                localStorage.removeItem("werewolf_player");

                window.location.href = "index.html";

                return;
            }

            const data = snapshot.val();

            const players = data.players || {};
            const playerIds = Object.keys(players);

            // ตรวจสอบสมาชิก
            const me = players[playerId];

            if (!me) {

                alert("คุณไม่ได้อยู่ในห้องนี้แล้ว!");

                localStorage.removeItem("werewolf_player");

                window.location.href = "index.html";

                return;
            }

            // สถานะเกม
            gameStatus.textContent = data.status;

            // Host Controls
            if (data.host === playerId &&
                data.status === "WAITING") {

                hostControls.classList.remove("hidden");

            } else {

                hostControls.classList.add("hidden");
            }

            // ข้อมูลตัวเอง
            myRole.textContent =
                data.status === "WAITING"
                    ? "รอเริ่มเกม"
                    : me.role || "ยังไม่มีบทบาท";

            myStatus.textContent =
                me.isAlive
                    ? "มีชีวิต 🟢"
                    : "เสียชีวิต 🔴";

            // รายชื่อผู้เล่น
            playerCount.textContent =
                `ผู้เล่น ${playerIds.length} คน`;

            playerList.innerHTML = "";

            playerIds.forEach((id) => {

                const player = players[id];

                const item = document.createElement("div");

                item.className =
                    "bg-gray-700 p-3 rounded-lg mb-2 flex justify-between items-center";

                const playerInfo = document.createElement("span");

                playerInfo.textContent =
                    player.name +
                    (id === data.host ? " 👑 (Host)" : "");

                const status = document.createElement("span");

                status.textContent =
                    player.isAlive ? "🟢" : "🔴";

                item.appendChild(playerInfo);
                item.appendChild(status);

                playerList.appendChild(item);

            });

        }, (error) => {

            console.error("Firebase Error:", error);

            alert("ไม่สามารถโหลดข้อมูลห้องได้: " + error.message);

        });

        // =========================
        // SHUFFLE ROLES
        // =========================

        function shuffle(array) {

            const result = [...array];

            for (let i = result.length - 1; i > 0; i--) {

                const j = Math.floor(Math.random() * (i + 1));

                [result[i], result[j]] =
                    [result[j], result[i]];
            }

            return result;
        }

        // =========================
        // START GAME
        // =========================

        startGameBtn.onclick = async () => {

            if (!confirm("คุณต้องการเริ่มเกมหรือไม่?")) {
                return;
            }

            startGameBtn.disabled = true;

            startGameBtn.textContent = "กำลังเริ่มเกม...";

            try {

                const result = await runTransaction(
                    roomRef,
                    (data) => {

                        if (!data) return;

                        // ตรวจสอบ Host
                        if (data.host !== playerId) {
                            return;
                        }

                        // ตรวจสอบสถานะ
                        if (data.status !== "WAITING") {
                            return;
                        }

                        const players = data.players || {};

                        const playerIds = Object.keys(players);

                        // ต้องมีอย่างน้อย 3 คน
                        if (playerIds.length < 3) {
                            return;
                        }

                        // สุ่มผู้เล่น
                        const shuffled = shuffle(playerIds);

                        // สุ่มบทบาท
                        shuffled.forEach((id, index) => {

                            players[id].role =
                                index === 0
                                    ? "Werewolf"
                                    : "Villager";

                            players[id].isAlive = true;

                        });

                        // เปลี่ยนสถานะเกม
                        data.players = players;
                        data.status = "NIGHT";

                        return data;

                    },
                    {
                        applyLocally: false
                    }
                );

                if (result.committed) {

                    alert("เริ่มเกมแล้ว! 🌙");

                } else {

                    const snapshot = await get(roomRef);

                    const data = snapshot.val();

                    if (!data) {
                        alert("ไม่พบห้อง");
                    } else if (data.host !== playerId) {
                        alert("เฉพาะ Host เท่านั้นที่เริ่มเกมได้");
                    } else if (data.status !== "WAITING") {
                        alert("เกมเริ่มไปแล้ว");
                    } else if (
                        Object.keys(data.players || {}).length < 3
                    ) {
                        alert("ต้องมีผู้เล่นอย่างน้อย 3 คน");
                    } else {
                        alert("ไม่สามารถเริ่มเกมได้");
                    }

                }

            } catch (error) {

                console.error(error);

                alert("เกิดข้อผิดพลาด: " + error.message);

            } finally {

                startGameBtn.disabled = false;

                startGameBtn.textContent = "🐺 เริ่มเกม";

            }

        };

        // =========================
        // LEAVE ROOM
        // =========================

        document.getElementById("leaveRoomBtn")
            .onclick = () => {

                if (!confirm("ต้องการออกจากห้องหรือไม่?")) {
                    return;
                }

                localStorage.removeItem("werewolf_player");

                window.location.href = "index.html";

            };

    </script>

</body>
</html>

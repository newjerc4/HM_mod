<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Murder - ห้องเกม</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: sans-serif; }
    </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen p-5">

    <div class="max-w-md mx-auto space-y-4">

        <!-- หัวข้อห้อง -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl text-center shadow-xl">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">รหัสห้อง</p>
            <h1 id="displayRoomCode" class="text-3xl font-extrabold text-amber-400 tracking-wider my-1">---</h1>

            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-between items-center text-sm">
                <span class="text-slate-400">สถานะเกม:</span>
                <span id="gameStatus" class="font-bold text-amber-500 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20">
                    กำลังรอผู้เล่น...
                </span>
            </div>
        </div>

        <!-- ข้อมูลของฉัน -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-2 shadow-xl">
            <h3 class="text-base font-bold text-slate-200 flex items-center gap-2">
                <span>👤</span> ข้อมูลของคุณ
            </h3>
            <div class="text-sm space-y-1 text-slate-300">
                <p>ชื่อ: <b id="myName" class="text-white">-</b></p>
                <p>บทบาท: <b id="myRole" class="text-amber-400">รอเริ่มเกม</b></p>
                <p>สถานะ: <b id="myStatus" class="text-emerald-400">มีชีวิต 🟢</b></p>
            </div>
        </div>

        <!-- Host Controls -->
        <div id="hostControls" class="hidden bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 shadow-xl">
            <h3 class="text-base font-bold text-amber-400 flex items-center gap-2">
                <span>👑</span> เมนู Host (ผู้สร้างห้อง)
            </h3>
            <button id="startGameBtn"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/10">
                เริ่มเกม (แจกบทบาท)
            </button>
            <p class="text-slate-400 text-xs text-center">
                ต้องมีผู้เล่นครบตามจำนวนที่กำหนดจึงจะเริ่มได้
            </p>
        </div>

        <!-- Player List -->
        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-3 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="text-base font-bold text-slate-200 flex items-center gap-2">
                    <span>👥</span> ผู้เล่นในห้อง
                </h3>
                <span id="playerCount" class="text-xs font-semibold bg-slate-800 text-slate-300 px-2.5 py-1 rounded-full border border-slate-700">
                    ผู้เล่น 0 คน
                </span>
            </div>

            <div id="playerList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                <!-- รายชื่อผู้เล่นจะถูกเติมที่นี่ -->
            </div>
        </div>

        <button id="leaveRoomBtn"
            class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white font-semibold py-3 rounded-xl border border-slate-700 transition">
            ออกจากห้อง
        </button>

    </div>

    <script type="module">
        import {
            db,
            ref,
            get,
            onValue,
            runTransaction
        } from "./firebase-config.js";

        // แปลงชื่อบทบาทเป็นภาษาไทย
        const ROLE_NAMES_TH = {
            Killer: "🗡️ คนร้าย (Killer)",
            Accomplice: "🤝 ผู้ช่วยคนร้าย (Accomplice)",
            Locksmith: "🔑 ช่างทำกุญแจ (Locksmith)",
            Housekeeper: "🧹 แม่บ้าน (Floor Scanner)",
            GlassCleaner: "🪟 ช่างเช็ดกระจก (Column Scanner)",
            Detective: "🔍 นักสืบ (Player Tracker)",
            Witness: "👁️ พยาน (Higher/Lower Sensor)",
            Innocent: "👤 ชาวบ้าน (Innocent)"
        };
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomCodeFromURL = urlParams.get('room');

        // ดึงข้อมูลผู้เล่นจาก localStorage (ใช้คีย์ใหม่ hotel_murder_session)
        let playerData;
        try {
            playerData = JSON.parse(localStorage.getItem("hotel_murder_session"));
        } catch (error) {
            playerData = null;
        }
    
        if (!playerData || !playerData.playerId) {
            alert("ไม่พบข้อมูลผู้เล่น!");
            window.location.href = "index.html";
            throw new Error("Player data not found");
        }
    
        // 3. จัดการดึงค่า (ถ้าใน localStorage ไม่มี roomCode แต่ใน URL มี ให้ใช้จาก URL แทน)
        const roomCode = playerData.roomCode || roomCodeFromURL;
        const playerId = playerData.playerId;
        const playerName = playerData.playerName; // แก้จาก name เป็น playerName ตามที่คุยกันก่อนหน้านี้
    
        if (!roomCode) {
            alert("ไม่พบรหัสห้อง!");
            window.location.href = "index.html";
            throw new Error("Room code not found");
        }

        const { roomCode, playerId, playerName } = playerData;
        const roomRef = ref(db, `rooms/${roomCode}`);

        // Elements
        const displayRoomCode = document.getElementById("displayRoomCode");
        const gameStatus = document.getElementById("gameStatus");
        const myName = document.getElementById("myName");
        const myRole = document.getElementById("myRole");
        const myStatus = document.getElementById("myStatus");
        const hostControls = document.getElementById("hostControls");
        const playerList = document.getElementById("playerList");
        const playerCount = document.getElementById("playerCount");
        const startGameBtn = document.getElementById("startGameBtn");

        displayRoomCode.textContent = roomCode;
        myName.textContent = playerName;

        // ฟังข้อมูล Realtime จาก Firebase
        onValue(roomRef, (snapshot) => {
            if (!snapshot.exists()) {
                alert("ห้องนี้ถูกลบแล้ว!");
                localStorage.removeItem("hotel_murder_session");
                window.location.href = "index.html";
                return;
            }

            const data = snapshot.val();
            const players = data.players || {};
            const playerIds = Object.keys(players);

            const me = players[playerId];
            if (!me) {
                alert("คุณไม่ได้อยู่ในห้องนี้แล้ว!");
                localStorage.removeItem("hotel_murder_session");
                window.location.href = "index.html";
                return;
            }

            // แสดงสถานะเกม
            gameStatus.textContent = data.status === "WAITING" ? "กำลังรอผู้เล่น..." : "🌙 เฟสกลางคืน (Night Phase)";

            // ตรวจสอบสิทธิ์ Host (เช็คจาก isHost ของ player คนนั้นๆ)
            if (me.isHost && data.status === "WAITING") {
                hostControls.classList.remove("hidden");
            } else {
                hostControls.classList.add("hidden");
            }

            // แสดงบทบาทของตัวเอง
            if (data.status === "WAITING") {
                myRole.textContent = "รอเริ่มเกม";
            } else {
                const roleKey = me.role;
                myRole.textContent = ROLE_NAMES_TH[roleKey] || roleKey || "ยังไม่มีบทบาท";
            }

            myStatus.textContent = me.isAlive ? "มีชีวิต 🟢" : "เสียชีวิต 🔴";

            // อัปเดตรายชื่อผู้เล่นในห้อง
            playerCount.textContent = `ผู้เล่น ${playerIds.length} / ${data.maxPlayers || '-'} คน`;
            playerList.innerHTML = "";

            playerIds.forEach((id) => {
                const player = players[id];
                const item = document.createElement("div");
                item.className = "bg-slate-950/60 p-3 rounded-xl flex justify-between items-center border border-slate-800/80";

                const playerInfo = document.createElement("span");
                playerInfo.className = "text-sm text-slate-200";
                playerInfo.textContent = player.name + (player.isHost ? " 👑 (Host)" : "");

                const status = document.createElement("span");
                status.textContent = player.isAlive ? "🟢" : "🔴";

                item.appendChild(playerInfo);
                item.appendChild(status);
                playerList.appendChild(item);
            });

        }, (error) => {
            console.error("Firebase Error:", error);
            alert("ไม่สามารถโหลดข้อมูลห้องได้: " + error.message);
        });

        // ฟังก์ชันสลับตำแหน่งอาเรย์ (Fisher-Yates Shuffle)
        function shuffle(array) {
            const result = [...array];
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        // กดปุ่มเริ่มเกม (แจกบทบาทตาม Preset ของห้อง)
        startGameBtn.onclick = async () => {
            if (!confirm("คุณต้องการเริ่มเกมและแจกบทบาททั้งหมดหรือไม่?")) {
                return;
            }

            startGameBtn.disabled = true;
            startGameBtn.textContent = "กำลังเริ่มเกม...";

            try {
                const result = await runTransaction(
                    roomRef,
                    (data) => {
                        if (!data) return;

                        const players = data.players || {};
                        const playerIds = Object.keys(players);
                        const me = players[playerId];

                        // ตรวจสอบสิทธิ์ Host
                        if (!me || !me.isHost) return;
                        if (data.status !== "WAITING") return;

                        const maxPlayers = data.maxPlayers || 6;
                        
                        // ตรวจสอบว่าผู้เล่นครบตามจำนวนที่กำหนดไหม (หรืออย่างน้อยตามจำนวน Preset)
                        if (playerIds.length < maxPlayers) {
                            return; // ถ้ายังไม่ครบ ไม่ให้เริ่ม
                        }

                        // ดึงรายการบทบาทที่เตรียมไว้ตามจำนวนคน
                        const rolesToUse = data.config && data.config.rolesToUse 
                            ? [...data.config.rolesToUse] 
                            : ["Killer", "Accomplice", "Locksmith", "Housekeeper", "GlassCleaner", "Innocent"];

                        // สลับตำแหน่งผู้เล่นและสลับบทบาท
                        const shuffledPlayerIds = shuffle(playerIds);
                        const shuffledRoles = shuffle(rolesToUse);

                        // แจกบทบาทให้ผู้เล่นทีละคน
                        shuffledPlayerIds.forEach((id, index) => {
                            if (players[id]) {
                                players[id].role = shuffledRoles[index] || "Innocent";
                                players[id].isAlive = true;
                            }
                        });

                        data.players = players;
                        data.status = "NIGHT"; // เปลี่ยนสถานะเข้าสู่คืนแรก

                        return data;
                    },
                    { applyLocally: false }
                );

                if (!result.committed) {
                    alert("ไม่สามารถเริ่มเกมได้ (ผู้เล่นอาจยังไม่ครบตามจำนวนที่กำหนด)");
                }

            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาด: " + error.message);
            } finally {
                startGameBtn.disabled = false;
                startGameBtn.textContent = "เริ่มเกม (แจกบทบาท)";
            }
        };

        // ออกจากห้อง
        document.getElementById("leaveRoomBtn").onclick = () => {
            if (!confirm("ต้องการออกจากห้องหรือไม่?")) {
                return;
            }
            localStorage.removeItem("hotel_murder_session");
            window.location.href = "index.html";
        };
    </script>

</body>
</html>

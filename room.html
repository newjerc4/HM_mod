<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game Room</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        .box { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .player-item { padding: 8px; margin: 4px; background: #f0f0f0; border-radius: 4px; }
        .hidden { display: none; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>ห้องเล่นเกม: <span id="displayRoomCode"></span></h2>
    <p>สถานะเกม: <b id="gameStatus">กำลังรอผู้เล่น...</b></p>

    <!-- ข้อมูลผู้เล่นคนนี้ -->
    <div class="box">
        <h3>ข้อมูลของคุณ</h3>
        <p>ชื่อ: <b id="myName">-</b></p>
        <p>บทบาท: <b id="myRole">ยังไม่ได้แจกบท</b></p>
        <p>สถานะ: <b id="myStatus">มีชีวิต</b></p>
    </div>

    <!-- ปุ่มควบคุมเฉพาะ Host -->
    <div id="hostControls" class="box hidden">
        <h3>เมนูสำหรับ Host</h3>
        <button id="startGameBtn">เริ่มเกม (สุ่มบทบาท)</button>
    </div>

    <!-- รายชื่อผู้เล่นในห้อง -->
    <div class="box">
        <h3>รายชื่อผู้เล่นในห้อง</h3>
        <div id="playerList"></div>
    </div>

    <script type="module">
        import { db, ref, update, onValue } from "./firebase-config.js";

        // ดึงข้อมูล Local Player
        const playerData = JSON.parse(localStorage.getItem('werewolf_player'));
        if (!playerData) {
            alert('ไม่พบข้อมูลการเข้าห้อง!');
            window.location.href = 'index.html';
        }

        const { roomCode, playerId, name } = playerData;
        document.getElementById('displayRoomCode').innerText = roomCode;
        document.getElementById('myName').innerText = name;

        const roomRef = ref(db, `rooms/${roomCode}`);

        // ฟังการเปลี่ยนแปลงข้อมูลใน Firebase แบบ Realtime
        onValue(roomRef, (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                alert('ห้องนี้ถูกลบไปแล้ว');
                window.location.href = 'index.html';
                return;
            }

            // แสดงสถานะเกม
            document.getElementById('gameStatus').innerText = data.status;

            // ตรวจสอบว่าตนเองเป็น Host หรือไม่
            if (data.host === playerId && data.status === 'WAITING') {
                document.getElementById('hostControls').classList.remove('hidden');
            } else {
                document.getElementById('hostControls').classList.add('hidden');
            }

            // อัปเดตข้อมูลของตัวเอง
            const me = data.players[playerId];
            if (me) {
                document.getElementById('myRole').innerText = data.status === 'WAITING' ? 'รอเริ่มเกม' : me.role;
                document.getElementById('myStatus').innerText = me.isAlive ? 'มีชีวิต 🟢' : 'เสียชีวิต 🔴';
            }

            // อัปเดตรายชื่อผู้เล่นทั้งหมด
            const playerListDiv = document.getElementById('playerList');
            playerListDiv.innerHTML = '';
            
            Object.keys(data.players).forEach(pId => {
                const p = data.players[pId];
                const item = document.createElement('div');
                item.className = 'player-item';
                item.innerText = `${p.name} ${pId === data.host ? '👑 (Host)' : ''} - ${p.isAlive ? 'มีชีวิต' : 'เสียชีวิต'}`;
                playerListDiv.appendChild(item);
            });
        });

        // ปุ่ม Host กดเริ่มเกมและสุ่มบทบาท
        document.getElementById('startGameBtn').onclick = async () => {
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val();
                const playerIds = Object.keys(data.players);

                if (playerIds.length < 3) {
                    return alert('ต้องมีผู้เล่นอย่างน้อย 3 คนขึ้นไป!');
                }

                // การสุ่มบทบาท (ตัวอย่าง: หมาป่า 1 คน, ที่เหลือเป็นชาวบ้าน)
                let shuffled = [...playerIds].sort(() => 0.5 - Math.random());
                let updates = {};

                updates[`rooms/${roomCode}/status`] = 'NIGHT'; // เปลี่ยนเฟสเป็นกลางคืน
                
                shuffled.forEach((id, index) => {
                    const assignedRole = (index === 0) ? 'Werewolf' : 'Villager';
                    updates[`rooms/${roomCode}/players/${id}/role`] = assignedRole;
                });

                await update(ref(db), updates);
            }, { onlyOnce: true });
        };
    </script>
</body>
</html>

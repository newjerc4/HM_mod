<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werewolf Game Lobby</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex justify-center items-center h-screen">

    <div class="bg-gray-800 p-6 rounded-lg shadow-lg w-80">
        <h2 class="text-2xl font-bold mb-4 text-center">เกมมนุษย์หมาป่า</h2>
        
        <!-- ช่องกรอกชื่อ -->
        <label class="block mb-2 text-sm">ชื่อของคุณ:</label>
        <input type="text" id="playerName" class="w-full p-2 mb-4 bg-gray-700 rounded text-white" placeholder="กรอกชื่อ...">

        <!-- ปุ่มสร้างห้องที่คุณส่งมา -->
        <button id="createRoomBtn" class="w-full bg-red-600 hover:bg-red-700 p-2 rounded font-bold transition mb-3">สร้างห้องใหม่</button>
        
        <hr class="border-gray-600 my-3">

        <!-- ช่องกรอกรหัสห้องสำหรับ Join -->
        <input type="text" id="roomCodeInput" class="w-full p-2 mb-2 bg-gray-700 rounded text-white uppercase" placeholder="รหัสห้อง 5 หลัก">
        <button id="joinRoomBtn" class="w-full bg-blue-600 hover:bg-blue-700 p-2 rounded font-bold transition">เข้าร่วมห้อง</button>
    </div>

    <!-- ส่วนของ JavaScript ที่ควบคุมปุ่ม -->
    <script type="module">
        import { db, ref, set, get } from "./firebase-config.js";

        const generateRoomCode = () => Math.random().toString(36).substring(2, 7).toUpperCase();

        // ฟังก์ชันเมื่อกดปุ่ม "สร้างห้องใหม่"
        document.getElementById('createRoomBtn').onclick = async () => {
            const name = document.getElementById('playerName').value.trim();
            if (!name) return alert('กรุณากรอกชื่อก่อน!');
            
            const roomCode = generateRoomCode();
            const playerId = 'p_' + Math.random().toString(36).substring(2, 7);

            // บันทึกข้อมูลห้องลง Firebase Realtime Database
            await set(ref(db, 'rooms/' + roomCode), {
                status: 'WAITING', 
                host: playerId,
                players: {
                    [playerId]: { name: name, role: 'Villager', isAlive: true }
                }
            });

            localStorage.setItem('werewolf_player', JSON.stringify({ roomCode, playerId, name }));
            window.location.href = `room.html?code=${roomCode}`;
        };

        // ฟังก์ชันเมื่อกดปุ่ม "เข้าร่วมห้อง"
        document.getElementById('joinRoomBtn').onclick = async () => {
            const name = document.getElementById('playerName').value.trim();
            const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!name || !roomCode) return alert('กรุณากรอกชื่อและรหัสห้อง!');

            const roomRef = ref(db, 'rooms/' + roomCode);
            const snapshot = await get(roomRef);

            if (!snapshot.exists()) return alert('ไม่พบห้องนี้!');
            const roomData = snapshot.val();
            if (roomData.status !== 'WAITING') return alert('เกมเริ่มไปแล้ว ไม่สามารถเข้าได้!');

            const playerId = 'p_' + Math.random().toString(36).substring(2, 7);
            await set(ref(db, `rooms/${roomCode}/players/${playerId}`), { name, role: 'Villager', isAlive: true });

            localStorage.setItem('werewolf_player', JSON.stringify({ roomCode, playerId, name }));
            window.location.href = `room.html?code=${roomCode}`;
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คดีปริศนาในโรงแรมมรณะ - หน้าแรก</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8 space-y-6">
        
        <!-- หัวข้อเกม -->
        <div class="text-center">
            <h1 class="text-3xl font-extrabold text-amber-400 tracking-wider">HOTEL MURDER [Moderator]</h1>
            <p class="text-slate-400 text-sm mt-1">คดีปริศนาในโรงแรมมรณะ</p>
        </div>

        <!-- ฟอร์มกรอกชื่อผู้เล่น -->
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">ชื่อผู้เล่นของคุณ</label>
                <input type="text" id="playerNameInput" placeholder="กรอกชื่อของคุณ..." 
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-400 transition">
            </div>

            <hr class="border-slate-800 my-4">

            <!-- ส่วนสร้างห้อง (Host Section) -->
            <div class="bg-slate-950/50 p-4 rounded-xl border border-slate-800/80 space-y-3">
                <h2 class="text-sm font-semibold text-amber-400 uppercase tracking-wide">สร้างห้องใหม่ (Host)</h2>
                
                <!-- Dropdown เลือกจำนวนผู้เล่น -->
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">จำนวนผู้เล่น (6 - 10 คน):</label>
                    <select id="playerCountSelect" onchange="updateRolePreview()" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:border-amber-400">
                        <option value="6">6 คน</option>
                        <option value="7">7 คน</option>
                        <option value="8">8 คน</option>
                        <option value="9">9 คน</option>
                        <option value="10">10 คน</option>
                    </select>
                </div>

                <!-- พรีวิวบทบาทที่จะใช้ -->
                <div class="bg-slate-900/80 rounded-lg p-3 border border-slate-800">
                    <span class="text-xs font-medium text-slate-400 block mb-2">บทบาทที่จะใช้ในเกมนี้:</span>
                    <ul id="roleListPreview" class="space-y-1 text-xs text-slate-300 max-h-28 overflow-y-auto pr-1">
                        <!-- เติมด้วย JS -->
                    </ul>
                </div>

                <button onclick="createRoom()" 
                    class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-xl transition shadow-lg shadow-amber-500/10">
                    สร้างห้องเกม
                </button>
            </div>

            <!-- ส่วนเข้าร่วมห้อง (Join Section) -->
            <div class="space-y-3 pt-2">
                <h2 class="text-sm font-semibold text-slate-300 uppercase tracking-wide">เข้าร่วมห้องที่มีอยู่</h2>
                <div>
                    <input type="text" id="roomCodeInput" placeholder="กรอกรหัสห้อง (5 หลัก)" maxlength="5"
                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-white uppercase tracking-widest text-center focus:outline-none focus:border-amber-400 transition">
                </div>
                <button onclick="joinRoom()" 
                    class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 rounded-xl border border-slate-700 transition">
                    เข้าร่วมห้อง
                </button>
            </div>

        </div>
    </div>

    <!-- Script เชื่อมต่อ Firebase และจัดการ Logic หน้าแรก -->
    <script type="module">
        import { db, ref, set, get } from "./firebase-config.js";

        // กำหนดชุดบทบาทตามจำนวนผู้เล่น (เปลี่ยน Innocent เป็น Drunk เรียบร้อย)

            9: ["Killer", "Accomplice", "Locksmith", "Housekeeper", "GlassCleaner", "Detective", "Witness", "Drunk", "Drunk"],

        };

            Locksmith: "🔑 ช่างทำกุญแจ (Locksmith)",

            GlassCleaner: "🪟 ช่างเช็ดกระจก (Column Scanner)",
            Detective: "🔍 นักสืบ (Player Tracker)",
            Witness: "👁️ พยาน (Higher/Lower Sensor)",
            Drunk: "🍻 คนเมา (Drunk)"
        };

        const swalTheme = {
            confirmButtonColor: '#f59e
